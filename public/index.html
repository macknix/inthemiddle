<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#091413" />
  <title>in the middle</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Absolute paths: this page is also served at /r/<room-id>. -->
  <link rel="stylesheet" href="/styles/main.css" />
</head>
<body>
  <div id="map"></div>

  <!-- One flow, three steps: where you are → who else → the middle.
       The panel is a bottom sheet on portrait phones, a left dock on
       landscape phones and a floating card on desktop (styles/main.css). -->
  <aside class="panel" data-step="start">
    <header class="panel-header">
      <button id="grabber" class="grabber" type="button" aria-label="Expand or collapse" aria-expanded="true"></button>
      <div class="title-row">
        <h1>in the middle</h1>
        <ol class="progress" aria-hidden="true"><li></li><li></li><li></li></ol>
        <button id="share-btn" class="chip" type="button" aria-haspopup="true" aria-expanded="false" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
          Invite
        </button>
      </div>
      <!-- Fallback when the browser has no native share sheet. -->
      <div class="share-menu" id="share-menu" hidden>
        <a id="share-whatsapp" target="_blank" rel="noopener">WhatsApp</a>
        <a id="share-email">Email</a>
        <button id="share-copy" type="button">Copy link</button>
      </div>
    </header>

    <!-- Landscape phones only: collapse/expand handle on the card's edge. -->
    <button id="side-toggle" type="button" aria-label="Expand or collapse" aria-expanded="true"></button>

    <!-- Step 1: where are you? -->
    <section class="step" id="step-start">
      <div class="step-head peek">
        <h2>Where are you starting?</h2>
        <button id="back-btn" class="chip" type="button" hidden>Back</button>
      </div>
      <button id="locate-btn" class="primary peek" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
        <span id="locate-label">Use my location</span>
      </button>
      <div class="field search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
        <input type="text" id="input-you" placeholder="or search an address" autocomplete="off"
               aria-label="Your starting address" enterkeyhint="search" />
        <div class="suggestions" id="suggestions-you"></div>
      </div>
      <p class="hint">or tap the map</p>
    </section>

    <!-- Step 2: who else? -->
    <section class="step" id="step-people" hidden>
      <h2 class="peek">Who are you meeting?</h2>
      <ul class="people" id="people"></ul>
      <div class="field search" id="add-field" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
        <input type="text" id="input-add" placeholder="Their address — or tap the map" autocomplete="off"
               aria-label="Another starting address" enterkeyhint="search" />
        <button id="add-cancel" class="field-x" type="button" aria-label="Cancel">×</button>
        <div class="suggestions" id="suggestions-add"></div>
      </div>
      <div class="pair" id="add-actions">
        <button id="invite-btn" class="secondary" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
          Invite
        </button>
        <button id="add-btn" class="secondary" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add address
        </button>
      </div>
      <button id="find" class="primary peek" type="button" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="12" r="7"/><circle cx="15" cy="12" r="7"/></svg>
        Find the middle
      </button>
      <div class="options">
        <button id="budget-chip" class="chip" type="button" aria-label="Maximum travel time each">≤ 60 min</button>
        <!-- The real input sits invisibly over the chip, so tapping it opens
             the native date/time picker. -->
        <span class="chip date-chip">
          <span id="depart-label">Leave now</span>
          <input type="datetime-local" id="depart" aria-label="Departure time" />
        </span>
      </div>
    </section>

    <!-- Step 3: the results. -->
    <section class="step" id="step-results" hidden>
      <div class="results-head peek">
        <h2>Meet here</h2>
        <button id="edit-btn" class="chip" type="button">Edit</button>
      </div>
      <ol class="results" id="results"></ol>
    </section>

    <p class="status" id="status" role="status" aria-live="polite"></p>

    <footer class="credits">
      Routing <a href="https://transitous.org" target="_blank" rel="noopener">Transitous</a>
      · © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>
    </footer>
  </aside>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"></script>
  <script src="/scripts/main.js"></script>
</body>
</html>
